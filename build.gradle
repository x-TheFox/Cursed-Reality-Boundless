plugins {
    id 'java-library'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    maven { name = 'GeckoLib'; url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/' }
    maven { name = 'SmartBrainLib'; url = 'https://dl.cloudsmith.io/public/tslat/sbl/maven/' }
    maven { name = 'Redlance (Player Animation Library)'; url = 'https://repo.redlance.org/public' }
    maven { name = 'BlameJared (Veil)'; url = 'https://maven.blamejared.com' }
    exclusiveContent {
        forRepository { maven { name = 'Modrinth'; url = 'https://api.modrinth.com/maven' } }
        filter { includeGroup 'maven.modrinth' }
    }
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        // Scripted visual checks: ./gradlew runHarnessServer, then ./gradlew runHarnessClient -PcrbHarness=<script>
        harnessServer {
            server()
            gameDirectory = project.file('run-harness-server')
            programArgument '--nogui'
            systemProperty 'crb.devAutoOp', 'true'
        }
        harnessClient {
            client()
            gameDirectory = project.file('run')
            systemProperty 'crb.devHarness', project.findProperty('crbHarness') ?: ''
            programArguments.addAll '--quickPlayMultiplayer', 'localhost:25565', '--username', 'Dev'
        }
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }

    unitTest {
        enable()
        testedMod = mods."${mod_id}"
    }
}

dependencies {
    implementation "software.bernie.geckolib:geckolib-neoforge-${minecraft_version}:${geckolib_version}"
    // Core + Mocha + Javassist are jar-in-jar'd; its POM pins libraries newer than Minecraft's strict versions.
    implementation("com.zigythebird.playeranim:PlayerAnimationLibNeo:${playeranim_version}") { transitive = false }
    implementation "maven.modrinth:free-camera-api:${freecamera_version}"
    implementation "foundry.veil:veil-neoforge-${minecraft_version}:${veil_version}"
    implementation "net.tslat.smartbrainlib:SmartBrainLib-neoforge-${minecraft_version}:${sbl_version}"

    // Jar-in-jar'd by Player Animation Library at runtime; unit tests load animations directly.
    testRuntimeOnly('com.zigythebird:mochafloats:4.1.0') { transitive = false }
    testRuntimeOnly 'org.javassist:javassist:3.30.2-GA'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.matching { it.name == 'runHarnessServer' }.configureEach {
    doFirst {
        def dir = project.file('run-harness-server')
        dir.mkdirs()
        new File(dir, 'eula.txt').text = 'eula=true\n'
        def props = new File(dir, 'server.properties')
        if (!props.exists()) props.text = 'online-mode=false\nspawn-protection=0\nlevel-type=minecraft\\:flat\ngamemode=creative\nspawn-monsters=false\nmotd=CRB harness\n'
    }
}

// Server-side GameTests (kits, ownership) run as part of `check`.
tasks.named('check') { dependsOn 'runGameTestServer' }

test {
    useJUnitPlatform()
    systemProperty 'crb.projectDir', projectDir.absolutePath
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
            geckolib_version       : geckolib_version,
            veil_version           : veil_version,
            sbl_version            : sbl_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-Xlint:deprecation'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
